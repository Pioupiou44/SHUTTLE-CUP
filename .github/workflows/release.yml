name: Release

on:
  push:
    tags:
      - 'v*'

# Permissions nécessaires pour créer une GitHub Release
permissions:
  contents: write

jobs:
  # ─── macOS (arm64 + x64) ─────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        # postinstall rebuilde automatiquement better-sqlite3 pour Electron
        run: npm ci

      - name: Build + publication macOS
        env:
          # GITHUB_TOKEN est fourni automatiquement par GitHub Actions
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de signature locale sur CI — les DMGs signés/notarisés sont
          # uploadés manuellement depuis la machine de développement
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Notarisation Apple (secrets optionnels du repo)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --arm64 --x64 --publish always

  # ─── Windows (x64) ───────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name: Build + publication Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --x64 --publish always

  # ─── Linux (x64) ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name: Build + publication Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux --x64 --publish always
