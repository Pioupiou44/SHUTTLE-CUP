name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─── macOS (arm64 + x64) ─────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name: Rebuild better-sqlite3 pour Electron
        run: npm run rebuild-natives

      - name: Build + publication macOS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Signature macOS (optionnel — sans ces vars, l'app n'est pas signée)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarisation Apple (optionnel)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --arm64 --x64 --publish always

  # ─── Windows (x64) ───────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name: Rebuild better-sqlite3 pour Electron
        run: npm run rebuild-natives

      - name: Build + publication Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build && npx electron-builder --win --x64 --publish always

  # ─── Linux (x64) ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name: Rebuild better-sqlite3 pour Electron
        run: npm run rebuild-natives

      - name: Build + publication Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build && npx electron-builder --linux --x64 --publish always
